<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NiagaBio Admin Master</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/admin-master/admin.css">
</head>
<body>
  <div id="loginScreen" class="admin-login">
    <form id="loginForm" class="admin-login-card">
      <h1>Admin Master</h1>
      <p>Login khusus admin NiagaBio Chatbot.</p>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button type="submit">Masuk</button>
      <p id="loginError" class="admin-error hidden"></p>
    </form>
  </div>

  <div id="dashboard" class="admin-dashboard hidden">
    <header class="admin-header">
      <h1><i class="bi bi-shield-check"></i> NiagaBio Admin</h1>
      <div class="admin-header-right">
        <button id="notifBell" class="notif-bell" aria-label="Notifikasi">
          <i class="bi bi-bell"></i>
          <span id="notifBadge" class="notif-badge hidden">0</span>
        </button>
        <div id="notifDropdown" class="notif-dropdown hidden">
          <div class="notif-dropdown-head">Notifikasi</div>
          <div id="notifList" class="notif-list"><p class="admin-empty">Tidak ada notifikasi.</p></div>
        </div>
        <span id="adminName"></span>
        <button id="logoutBtn">Keluar</button>
      </div>
    </header>

    <nav class="admin-tabs">
      <button data-tab="sessions" class="active">Sesi Chat</button>
      <button data-tab="leads">Leads</button>
      <button data-tab="admins" id="tabAdminsBtn" class="hidden">Kelola Admin</button>
    </nav>

    <main class="admin-main">
      <section id="tab-sessions" class="admin-panel">
        <div class="admin-split">
          <div class="admin-list-col">
            <div class="admin-list-tools">
              <input type="search" id="sessionSearch" placeholder="Cari nama/email/WA...">
              <select id="sessionFilter">
                <option value="all">Semua sesi</option>
                <option value="needs_admin">Butuh Admin</option>
                <option value="open">Terbuka</option>
                <option value="closed">Ditutup</option>
              </select>
            </div>
            <div class="admin-list" id="sessionList"></div>
          </div>
          <div class="admin-thread-col">
            <div id="threadHeader" class="thread-header hidden">
              <div>
                <div class="thread-header-name" id="threadName">-</div>
                <div class="thread-header-meta" id="threadMeta">-</div>
              </div>
              <button id="closeSessionBtn" class="btn-ghost-sm"><i class="bi bi-check2-circle"></i> Tandai Selesai</button>
            </div>
            <div class="admin-thread" id="sessionThread"><p class="admin-empty">Pilih sesi untuk melihat percakapan.</p></div>
            <form id="replyForm" class="reply-composer hidden">
              <div class="quick-reply-wrap">
                <button type="button" id="quickReplyBtn" title="Balasan cepat"><i class="bi bi-lightning-charge-fill"></i></button>
                <div id="quickReplyList" class="quick-reply-list hidden"></div>
              </div>
              <textarea id="replyText" placeholder="Ketik balasan ke user..." rows="1" required></textarea>
              <button type="submit" title="Kirim"><i class="bi bi-send-fill"></i></button>
            </form>
          </div>
        </div>
      </section>

      <section id="tab-leads" class="admin-panel hidden">
        <table class="admin-table">
          <thead><tr><th>Waktu</th><th>Event</th><th>Skor</th><th>Sesi</th></tr></thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </section>

      <section id="tab-admins" class="admin-panel hidden">
        <form id="addAdminForm" class="admin-inline-form">
          <input type="text" id="newAdminUserId" placeholder="Auth User ID admin baru">
          <input type="text" id="newAdminName" placeholder="Nama tampilan">
          <select id="newAdminRole"><option value="admin">admin</option><option value="master">master</option></select>
          <button type="submit">Tambah</button>
        </form>
        <table class="admin-table">
          <thead><tr><th>Nama</th><th>Role</th><th>Status</th></tr></thead>
          <tbody id="adminsBody"></tbody>
        </table>
        <h3 class="admin-subheading">Balasan Cepat</h3>
        <p class="admin-hint">Template jawaban yang bisa dipilih cepat saat membalas chat user.</p>
        <form id="addQuickReplyForm" class="admin-inline-form">
          <input type="text" id="newQuickReply" placeholder="Tulis balasan template...">
          <button type="submit">Tambah</button>
        </form>
        <div id="quickReplyManageList"></div>
      </section>
    </main>
  </div>

  <script type="module" src="/admin-master/admin.js"></script>
</body>
</html>
